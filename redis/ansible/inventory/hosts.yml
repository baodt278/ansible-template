---
# Giá trị thật nằm trong .env (scripts/run.sh nạp trước khi chạy).
# redis_ip: IP nội bộ dùng cho ứng dụng, nhân bản, Sentinel, VRRP.
# redis_initial_role: chỉ dùng ở lần cài đầu; sau đó master do Sentinel quyết định.
all:
  children:
    redis:
      hosts:
        redis-1:
          ansible_host: "{{ lookup('ansible.builtin.env', 'REDIS_1_SSH_HOST') }}"
          redis_ip: "{{ lookup('ansible.builtin.env', 'REDIS_1_IP') }}"
          redis_initial_role: master
        redis-2:
          ansible_host: "{{ lookup('ansible.builtin.env', 'REDIS_2_SSH_HOST') }}"
          redis_ip: "{{ lookup('ansible.builtin.env', 'REDIS_2_IP') }}"
          redis_initial_role: replica
        redis-3:
          ansible_host: "{{ lookup('ansible.builtin.env', 'REDIS_3_SSH_HOST') }}"
          redis_ip: "{{ lookup('ansible.builtin.env', 'REDIS_3_IP') }}"
          redis_initial_role: replica
      vars:
        ansible_user: "{{ lookup('ansible.builtin.env', 'ANSIBLE_SSH_USER') }}"
        ansible_ssh_private_key_file: "{{ lookup('ansible.builtin.env', 'ANSIBLE_SSH_KEY_FILE') }}"
