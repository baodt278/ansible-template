---
# Master hiện tại = câu trả lời của Sentinel (nếu đã chạy); lần cài đầu = máy có redis_initial_role: master.
# Nhờ vậy chạy lại setup sau khi Sentinel đã chuyển master sẽ không ghi đè cấu hình về master cũ.
- name: Ask local Sentinel for the current master
  ansible.builtin.command:
    argv:
      - redis-cli
      - -h
      - 127.0.0.1
      - -p
      - "{{ sentinel_port }}"
      - --no-auth-warning
      - SENTINEL
      - get-master-addr-by-name
      - "{{ sentinel_master_name }}"
  environment:
    REDISCLI_AUTH: "{{ redis_sentinel_password }}"
  register: redis_sentinel_query
  changed_when: false
  failed_when: false

- name: Record master reported by this node
  ansible.builtin.set_fact:
    redis_sentinel_reported_master: >-
      {{ redis_sentinel_query.stdout_lines[0]
         if (redis_sentinel_query.rc | default(1) == 0
             and redis_sentinel_query.stdout_lines | default([]) | length == 2
             and redis_sentinel_query.stdout_lines[0] is match('^\d{1,3}(\.\d{1,3}){3}$'))
         else '' }}

- name: Decide current master
  ansible.builtin.set_fact:
    redis_current_master_ip: >-
      {{ (groups[cluster_group] | map('extract', hostvars)
          | map(attribute='redis_sentinel_reported_master', default='') | select | list | first)
         | default(groups[cluster_group] | map('extract', hostvars)
          | selectattr('redis_initial_role', 'equalto', 'master') | map(attribute='redis_ip') | first, true) }}

- name: Validate current master is one of the nodes
  ansible.builtin.assert:
    that:
      - redis_current_master_ip in (groups[cluster_group] | map('extract', hostvars, 'redis_ip') | list)
    fail_msg: "Sentinel reports master {{ redis_current_master_ip }}, which is not in the inventory."

- name: Show current master
  ansible.builtin.debug:
    msg: "Current Redis master: {{ redis_current_master_ip }}"
  run_once: true
