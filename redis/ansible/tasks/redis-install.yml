---
- name: Create APT keyrings directory
  ansible.builtin.file:
    path: "{{ redis_apt_keyring | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download Redis APT signing key
  ansible.builtin.get_url:
    url: "{{ redis_apt_key_url }}"
    dest: "{{ redis_apt_keyring }}"
    owner: root
    group: root
    mode: "0644"

- name: Add Redis APT repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/redis.list
    content: "deb [signed-by={{ redis_apt_keyring }}] {{ redis_apt_repo_url }} {{ ansible_facts.distribution_release }} main\n"
    owner: root
    group: root
    mode: "0644"
  register: redis_apt_repo

# Ghim dòng phiên bản: apt chỉ nâng bản vá trong cùng dòng (vd 7.4.x), không tự lên 8.x.
- name: Pin Redis packages to the configured series
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/redis
    content: |
      Package: redis redis-server redis-tools redis-sentinel
      Pin: version {{ redis_apt_epoch }}:{{ redis_version_series }}.*
      Pin-Priority: 1001
    owner: root
    group: root
    mode: "0644"
  register: redis_apt_pin

- name: Install Redis and OS packages
  ansible.builtin.apt:
    name: "{{ redis_install_packages }}"
    state: present
    update_cache: true
    cache_valid_time: "{{ 0 if (redis_apt_repo.changed or redis_apt_pin.changed) else 3600 }}"
    install_recommends: false
    # Ghim > 1000: được hạ bản nếu máy đã lỡ cài bản mới hơn (vd 8.x).
    allow_downgrade: true
  environment:
    DEBIAN_FRONTEND: noninteractive

# Gói tự bật redis-server.service trên 127.0.0.1:6379; dịch vụ của ta dùng unit riêng.
- name: Stop and mask packaged redis-server unit
  ansible.builtin.systemd:
    name: redis-server.service
    state: stopped
    enabled: false
    masked: true
  failed_when: false

# redis-sentinel là tên dịch vụ của ta: gỡ khóa nếu bản trước đã khóa.
- name: Unmask redis-sentinel (bản trước khóa nhầm tên này)
  ansible.builtin.systemd:
    name: "{{ sentinel_service_name }}.service"
    masked: false
  failed_when: false

# Bí danh redis.service → redis-server.service của gói (gói tạo khi bật): gỡ để tên redis.service là của ta.
- name: Check packaged redis.service alias
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ redis_service_name }}.service"
  register: redis_alias_stat

- name: Remove packaged redis.service alias
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ redis_service_name }}.service"
    state: absent
  when: redis_alias_stat.stat.islnk | default(false)

- name: Stop and disable services with legacy names
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop: "{{ redis_legacy_services }}"
  failed_when: false

- name: Remove legacy unit and config files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ (redis_legacy_services | map('regex_replace', '^', '/etc/systemd/system/') | map('regex_replace', '$', '.service') | list) + redis_legacy_files }}"
  register: redis_legacy_removed

- name: Reload systemd after removing legacy units  # noqa: no-handler
  ansible.builtin.systemd:
    daemon_reload: true
  when: redis_legacy_removed.changed

- name: Read installed Redis version
  ansible.builtin.command: redis-server --version
  register: redis_version_out
  changed_when: false

- name: Confirm Redis version series
  ansible.builtin.assert:
    that:
      - ("v=" ~ redis_version_series ~ ".") in redis_version_out.stdout
    fail_msg: "Installed Redis is not {{ redis_version_series }}.x: {{ redis_version_out.stdout }}"
