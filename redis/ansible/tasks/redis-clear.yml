---
- name: Require explicit confirmation
  ansible.builtin.assert:
    that:
      - confirm_clear | default('') == 'yes'
    fail_msg: "This stops Redis on all nodes. Re-run with -e confirm_clear=yes (add -e clear_data=yes to also delete data and backups)."
  run_once: true

- name: Stop and disable services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - "{{ sentinel_service_name }}"
    - "{{ redis_service_name }}"
  failed_when: false

- name: Remove managed files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/etc/systemd/system/{{ redis_service_name }}.service"
    - "/etc/systemd/system/{{ sentinel_service_name }}.service"
    - /usr/local/sbin/redis-backup.sh
    - /etc/cron.d/vtvl-redis-backup
    - /etc/logrotate.d/vtvl-redis
    - "{{ config_dir }}/{{ redis_service_name }}.conf"
    - "{{ config_dir }}/{{ redis_service_name }}.conf.managed"
    - "{{ config_dir }}/users.acl"
    - "{{ config_dir }}/users.acl.managed"
    - "{{ sentinel_dir }}/sentinel.conf"

- name: Remove data, logs and backups
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ data_dir }}"
    - "{{ sentinel_dir }}"
    - "{{ log_dir }}"
    - "{{ backup_dir }}"
  when: clear_data | default('') == 'yes'

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
