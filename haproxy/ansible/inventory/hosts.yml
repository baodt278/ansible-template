---
# Giá trị thật nằm trong .env (scripts/run.sh nạp trước khi chạy).
# haproxy_ip: IP của máy (trang thống kê /metrics nghe trên IP này).
all:
  children:
    haproxy:
      hosts:
        haproxy-1:
          ansible_host: "{{ lookup('ansible.builtin.env', 'HAPROXY_1_SSH_HOST') }}"
          haproxy_ip: "{{ lookup('ansible.builtin.env', 'HAPROXY_1_IP') }}"
        haproxy-2:
          ansible_host: "{{ lookup('ansible.builtin.env', 'HAPROXY_2_SSH_HOST') }}"
          haproxy_ip: "{{ lookup('ansible.builtin.env', 'HAPROXY_2_IP') }}"
      vars:
        ansible_user: "{{ lookup('ansible.builtin.env', 'ANSIBLE_SSH_USER') }}"
        ansible_ssh_private_key_file: "{{ lookup('ansible.builtin.env', 'ANSIBLE_SSH_KEY_FILE') }}"
