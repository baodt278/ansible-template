---
- name: Gather service facts
  ansible.builtin.service_facts:

- name: Verify services are running
  ansible.builtin.assert:
    that:
      - ansible_facts.services[item ~ '.service'].state | default('') == 'running'
    fail_msg: "{{ item }} is not running on {{ inventory_hostname }}."
  loop:
    - haproxy

- name: Validate running configuration
  ansible.builtin.command: haproxy -c -f {{ config_dir }}/haproxy.cfg
  changed_when: false

- name: Check listening ports
  ansible.builtin.wait_for:
    host: "{{ item.host }}"
    port: "{{ item.port }}"
    timeout: 10
  loop: >-
    {{ [{'host': '127.0.0.1', 'port': haproxy_https_port}, {'host': haproxy_ip, 'port': haproxy_stats_port}]
       + ([] if haproxy_behind_waf | bool else [{'host': '127.0.0.1', 'port': haproxy_http_port}]) }}

- name: Check HTTP redirects to HTTPS
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ haproxy_http_port }}/"
    follow_redirects: none
    status_code: [301, 308]
  when: not haproxy_behind_waf | bool

- name: Check Keycloak admin is blocked from the Internet entry
  ansible.builtin.uri:
    url: "https://127.0.0.1:{{ haproxy_https_port }}/auth/admin/"
    validate_certs: false
    status_code: 404

- name: Read backend health from Prometheus endpoint
  ansible.builtin.uri:
    url: "http://{{ haproxy_ip }}:{{ haproxy_stats_port }}/metrics"
    url_username: "{{ haproxy_stats_user }}"
    url_password: "{{ haproxy_stats_password }}"
    force_basic_auth: true
    return_content: true
  register: haproxy_metrics
  no_log: true

- name: Report NodePort health per backend
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }} be_{{ item.name }}:
      {{ haproxy_metrics.content
         | regex_findall('haproxy_server_status\{proxy="be_' ~ item.name ~ '",server="[^"]+",state="UP"\} 1')
         | length }}/{{ haproxy_k8s_nodes | length }} nút UP
  loop: "{{ haproxy_backends }}"
  loop_control:
    label: "be_{{ item.name }}"
