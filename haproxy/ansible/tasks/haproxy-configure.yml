---
- name: Install TLS certificate
  ansible.builtin.copy:
    src: "{{ haproxy_tls_pem_src }}"
    dest: "{{ cert_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  register: haproxy_cert

- name: Hash stats password
  ansible.builtin.import_tasks: haproxy-stats-hash.yml

- name: Render HAProxy configuration
  ansible.builtin.template:
    src: "{{ templates_dir }}/haproxy.cfg.j2"
    dest: "{{ config_dir }}/haproxy.cfg"
    owner: root
    group: haproxy
    mode: "0640"
    validate: haproxy -c -f %s
  register: haproxy_config

- name: Render systemd override
  ansible.builtin.template:
    src: "{{ templates_dir }}/haproxy-override.conf.j2"
    dest: /etc/systemd/system/haproxy.service.d/override.conf
    owner: root
    group: root
    mode: "0644"
  register: haproxy_override

- name: Enable and start HAProxy
  ansible.builtin.systemd:
    name: haproxy
    enabled: true
    state: started
    daemon_reload: "{{ haproxy_override.changed }}"

# reload: không cắt kết nối đang chạy. Đổi override systemd thì cần restart.
- name: Apply HAProxy changes
  ansible.builtin.systemd:
    name: haproxy
    state: "{{ 'restarted' if haproxy_override.changed else 'reloaded' }}"
  when: haproxy_config.changed or haproxy_override.changed or (haproxy_cert.changed | default(false))
