---
- name: Persist kernel settings
  ansible.builtin.template:
    src: "{{ templates_dir }}/haproxy-sysctl.conf.j2"
    dest: /etc/sysctl.d/99-haproxy.conf
    owner: root
    group: root
    mode: "0644"
  register: haproxy_sysctl

- name: Apply kernel settings  # noqa: no-handler
  ansible.builtin.command: sysctl --system
  when: haproxy_sysctl.changed
  changed_when: true

- name: Create certificate directory
  ansible.builtin.file:
    path: "{{ cert_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Create systemd override directory
  ansible.builtin.file:
    path: /etc/systemd/system/haproxy.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
