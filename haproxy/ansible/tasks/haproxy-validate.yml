---
# Kiểm tra biến (.env, inventory) — không cần kết nối máy chủ; dùng cho cả setup và bundle.
- name: Validate inventory has HAProxy hosts
  ansible.builtin.assert:
    that:
      - groups['haproxy'] | length >= 1
    fail_msg: "Inventory must define at least one HAProxy host."
  run_once: true

- name: Validate host addresses
  ansible.builtin.assert:
    that:
      - haproxy_ip is match('^\d{1,3}(\.\d{1,3}){3}$')
    fail_msg: "{{ inventory_hostname }}: check HAPROXY_*_IP in .env."

- name: Validate Kubernetes nodes
  ansible.builtin.assert:
    that:
      - haproxy_k8s_nodes | length > 0
      - haproxy_k8s_nodes | reject('match', '^\d{1,3}(\.\d{1,3}){3}$') | list | length == 0
    fail_msg: "HAPROXY_K8S_NODES must be a comma-separated list of node IPs, got: {{ haproxy_k8s_nodes_raw }}"
  run_once: true

- name: Validate NodePorts (web, api, keycloak required; otlp, ban-cai optional)
  ansible.builtin.assert:
    that:
      - item.value | string is match('^\d{4,5}$')
      - item.value | int >= 1 and item.value | int <= 65535
    fail_msg: "{{ item.name }} must be a port number (NodePort, usually 30000-32767), got: '{{ item.value }}'"
  loop:
    - { name: HAPROXY_NODEPORT_WEB, value: "{{ haproxy_nodeport_web }}" }
    - { name: HAPROXY_NODEPORT_API, value: "{{ haproxy_nodeport_api }}" }
    - { name: HAPROXY_NODEPORT_KEYCLOAK, value: "{{ haproxy_nodeport_keycloak }}" }
    - { name: HAPROXY_NODEPORT_OTLP, value: "{{ haproxy_nodeport_otlp }}", optional: true }
    - { name: HAPROXY_NODEPORT_BAN_CAI, value: "{{ haproxy_nodeport_ban_cai }}", optional: true }
  loop_control:
    label: "{{ item.name }}"
  when: not (item.optional | default(false)) or (item.value | length > 0)
  run_once: true

- name: Validate WAF ranges
  ansible.builtin.assert:
    that:
      - haproxy_waf_ranges | reject('match', '^\d{1,3}(\.\d{1,3}){3}(/\d{1,2})?$') | list | length == 0
    fail_msg: "HAPROXY_WAF_RANGES must be a comma-separated list of IP or CIDR, got: {{ haproxy_waf_ranges_raw }}"
  run_once: true

- name: Check TLS PEM file on control node
  ansible.builtin.stat:
    path: "{{ haproxy_tls_pem_src }}"
  delegate_to: localhost
  become: false
  register: haproxy_pem_stat
  run_once: true

- name: Validate TLS PEM contains certificate and private key
  ansible.builtin.assert:
    that:
      - haproxy_pem_stat.stat.exists | default(false)
      - lookup('ansible.builtin.file', haproxy_tls_pem_src) is search('BEGIN CERTIFICATE')
      - lookup('ansible.builtin.file', haproxy_tls_pem_src) is search('BEGIN (RSA |EC )?PRIVATE KEY')
    fail_msg: "HAPROXY_TLS_PEM_FILE must point to a PEM with certificate chain + private key on the control node."
  run_once: true
  no_log: true

- name: Validate stats credentials
  ansible.builtin.assert:
    that:
      - haproxy_stats_user is match('^[A-Za-z0-9._-]{3,}$')
      - haproxy_stats_password is match('^[A-Za-z0-9._~-]{16,}$')
    fail_msg: "HAPROXY_STATS_USER (letters/digits) and HAPROXY_STATS_PASSWORD (>= 16 chars of A-Z a-z 0-9 . _ ~ -) are required."
  run_once: true
  no_log: true
