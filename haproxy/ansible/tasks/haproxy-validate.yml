---
# Kiểm tra biến (.env, inventory) — không cần kết nối máy chủ; dùng cho cả setup và bundle.
- name: Validate inventory has HAProxy hosts
  ansible.builtin.assert:
    that:
      - groups['haproxy'] | length >= 1
    fail_msg: "Inventory must define at least one HAProxy host."
  run_once: true

- name: Validate host addresses
  ansible.builtin.assert:
    that:
      - haproxy_ip is match('^\d{1,3}(\.\d{1,3}){3}$')
    fail_msg: "{{ inventory_hostname }}: check HAPROXY_*_IP in .env."

- name: Validate Ingress backends
  ansible.builtin.assert:
    that:
      - haproxy_ingress_servers | length > 0
      - haproxy_ingress_servers | reject('match', '^\d{1,3}(\.\d{1,3}){3}:\d{1,5}$') | list | length == 0
    fail_msg: "HAPROXY_INGRESS_SERVERS must be a comma-separated list of ip:port, got: {{ haproxy_ingress_servers_raw }}"
  run_once: true

- name: Validate TLS mode
  ansible.builtin.assert:
    that:
      - haproxy_tls_mode in ['terminate', 'passthrough']
    fail_msg: "HAPROXY_TLS_MODE must be terminate or passthrough."
  run_once: true

- name: Check TLS PEM file on control node
  ansible.builtin.stat:
    path: "{{ haproxy_tls_pem_src }}"
  delegate_to: localhost
  become: false
  register: haproxy_pem_stat
  run_once: true
  when: haproxy_tls_mode == 'terminate'

- name: Validate TLS PEM contains certificate and private key
  ansible.builtin.assert:
    that:
      - haproxy_pem_stat.stat.exists | default(false)
      - lookup('ansible.builtin.file', haproxy_tls_pem_src) is search('BEGIN CERTIFICATE')
      - lookup('ansible.builtin.file', haproxy_tls_pem_src) is search('BEGIN (RSA |EC )?PRIVATE KEY')
    fail_msg: "HAPROXY_TLS_PEM_FILE must point to a PEM with certificate chain + private key on the control node."
  run_once: true
  no_log: true
  when: haproxy_tls_mode == 'terminate'

- name: Validate stats credentials
  ansible.builtin.assert:
    that:
      - haproxy_stats_user is match('^[A-Za-z0-9._-]{3,}$')
      - haproxy_stats_password is match('^[A-Za-z0-9._~-]{16,}$')
    fail_msg: "HAPROXY_STATS_USER (letters/digits) and HAPROXY_STATS_PASSWORD (>= 16 chars of A-Z a-z 0-9 . _ ~ -) are required."
  run_once: true
  no_log: true
