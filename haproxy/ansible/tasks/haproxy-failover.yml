---
- name: Ensure keepalived configuration directory exists
  ansible.builtin.file:
    path: /etc/keepalived
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render keepalived configuration
  ansible.builtin.template:
    src: "{{ templates_dir }}/haproxy-keepalived.conf.j2"
    dest: /etc/keepalived/keepalived.conf
    owner: root
    group: root
    mode: "0600"
  register: haproxy_keepalived_conf

- name: Validate keepalived configuration
  ansible.builtin.command: keepalived --config-test -f /etc/keepalived/keepalived.conf
  changed_when: false

- name: Enable and (re)start keepalived
  ansible.builtin.systemd:
    name: keepalived
    enabled: true
    state: "{{ 'restarted' if haproxy_keepalived_conf.changed else 'started' }}"

- name: Wait for VIP on active node only
  ansible.builtin.command: ip -o -4 addr show dev {{ haproxy_vip_interface }}
  register: haproxy_vip_state
  changed_when: false
  until: >-
    (role == 'active') == ((' ' ~ haproxy_vip ~ '/') in haproxy_vip_state.stdout)
  retries: 15
  delay: 2
