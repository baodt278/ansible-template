---
- name: Validate variables
  ansible.builtin.import_tasks: haproxy-validate.yml

- name: Validate SSH host is set
  ansible.builtin.assert:
    that:
      - ansible_host | length > 0
    fail_msg: "{{ inventory_hostname }}: HAPROXY_*_SSH_HOST is empty in .env."

- name: Validate operating system
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == 'Ubuntu'
      - ansible_facts.distribution_major_version | int >= 22
    fail_msg: "Expected Ubuntu 22.04+ (production: 24.04), found {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}."

- name: Validate this host carries haproxy_ip
  ansible.builtin.command: ip -o -4 addr show
  register: haproxy_iface_addr
  changed_when: false
  failed_when: >-
    haproxy_iface_addr.rc != 0 or
    (' ' ~ haproxy_ip ~ '/') not in haproxy_iface_addr.stdout

- name: Check NodePorts are reachable from HAProxy
  ansible.builtin.wait_for:
    host: "{{ item.1 }}"
    port: "{{ item.0.port | int }}"
    timeout: 5
  loop: "{{ haproxy_backends | product(haproxy_k8s_nodes) | list }}"
  loop_control:
    label: "{{ item.0.name }} {{ item.1 }}:{{ item.0.port }}"
  register: haproxy_backend_reach
  failed_when: false

- name: Warn about unreachable NodePorts
  ansible.builtin.debug:
    msg: >-
      WARNING: {{ inventory_hostname }} cannot reach {{ item.item.0.name }} at
      {{ item.item.1 }}:{{ item.item.0.port }} (security group / Service chưa tạo?).
  loop: "{{ haproxy_backend_reach.results }}"
  loop_control:
    label: "{{ item.item.0.name }} {{ item.item.1 }}"
  # failed_when: false xóa cờ failed, nên nhận biết lỗi qua thông điệp của wait_for.
  when: (item.msg | default('')) is search('Timeout|refused|No route', ignorecase=True)
