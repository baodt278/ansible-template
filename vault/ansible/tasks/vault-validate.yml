---
# Kiểm tra biến (.env, inventory) — không cần kết nối máy chủ; dùng cho cả setup và bundle.
- name: Validate Vault address
  ansible.builtin.assert:
    that:
      - vault_ip is match('^\d{1,3}(\.\d{1,3}){3}$')
    fail_msg: "{{ inventory_hostname }}: VAULT_1_IP is empty/invalid in .env."

- name: Validate optional hostname
  ansible.builtin.assert:
    that:
      - vault_hostname | length == 0 or vault_hostname is match('^[A-Za-z0-9.-]+$')
    fail_msg: "VAULT_HOSTNAME must be a DNS name (letters, digits, dots, dashes) or empty."
