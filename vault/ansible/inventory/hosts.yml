---
# Giá trị thật nằm trong .env (scripts/run.sh nạp trước khi chạy).
# Vault 1 nút (Raft), đặt chung máy Redis-1. Thêm nút sau: thêm vault-2, vault-3 rồi raft join.
all:
  children:
    vault:
      hosts:
        vault-1:
          ansible_host: "{{ lookup('ansible.builtin.env', 'VAULT_1_SSH_HOST') }}"
          vault_ip: "{{ lookup('ansible.builtin.env', 'VAULT_1_IP') }}"
          vault_node_id: vault-1
      vars:
        ansible_user: "{{ lookup('ansible.builtin.env', 'ANSIBLE_SSH_USER') }}"
        ansible_ssh_private_key_file: "{{ lookup('ansible.builtin.env', 'ANSIBLE_SSH_KEY_FILE') }}"
